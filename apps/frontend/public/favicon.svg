<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Hereya-branded favicon: dark navy rounded square + serif lowercase "h"
    in the brand red (#E63946 on #1A1A2E). The serif glyph echoes the
    Playfair Display headings used across the template; falls back to
    Georgia / system serif so the favicon renders consistently even
    without the brand font available at the favicon-rasterization step.
  -->
  <rect width="32" height="32" rx="7" fill="#1A1A2E"/>
  <text
    x="16"
    y="24"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="700"
    fill="#E63946"
    text-anchor="middle"
  >h</text>
</svg>
