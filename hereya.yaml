# project: <auto set>
# workspace: <auto set>
packages:
  hereya/aws-postgres-serverless:
    version: 0.1.7
  aws/cognito:
    version: 0.3.3
  hereya/postmark-app-server:
    version: 0.2.3
  # Scopes IAM access on the workspace's shared S3 bucket to a per-app
  # prefix and emits `s3Prefix` + a prefix-bounded `iamPolicyAwsS3Bucket`.
  # The shared bucket itself is provisioned by the workspace (via a
  # workspace-level hereya/aws-s3-shared), which exposes `bucketArn` +
  # `bucketName` to this template's env. The backend prepends `s3Prefix`
  # to every object key in storage/s3.ts.
  hereya/aws-file-storage:
    version: 0.1.1
devDeploy:
  hereya/dev-iam-user:
    version: 0.1.1
deploy:
  hereya/aws-app-lambda:
    version: 0.4.1
preDeployCommand: npm install && npm run build
