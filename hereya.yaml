# project: <auto set>
# workspace: <auto set>
packages:
  # New: the minimal template's source of truth for non-auth app state.
  # Provisions two DDB tables:
  #   • RegistrationsTable — public registration form submissions
  #   • OAuthStateTable    — OAuth/MCP machinery (clients, codes, tokens)
  hereya/aws-ddb-app-state:
    version: 0.1.0

  # Auth: Cognito + DDB tables for sessions, users, roles, OTP.
  aws/cognito:
    version: 0.3.3

  # OTP email sender. Auto-resolves SSM SecureString for the Postmark
  # token; the backend reads `postmarkServerToken` as a normal env var.
  hereya/postmark-app-server:
    version: 0.2.4

  # Aurora Postgres for relational app data. NOT used by the minimal
  # template's code — kept here so patterns that opt in (notes,
  # full-blown CRUD models) work out of the box. See docs/patterns/notes.md.
  hereya/aws-postgres-serverless:
    version: 0.1.7

  # Per-app prefix on the workspace-shared S3 bucket. NOT used by the
  # minimal template's code — kept here so the attachments pattern
  # works out of the box. See docs/patterns/attachments.md.
  #
  # Optional `deleteObjects` lifecycle rules are configured in
  # hereyaconfig/hereyavars/hereya--aws-file-storage.yaml. Add one
  # entry per sub-prefix you want auto-expired (e.g. ephemeral
  # download/upload directories).
  hereya/aws-file-storage:
    version: 0.2.1

  # KMS-encrypted vault for user-supplied secrets (admin integration
  # keys, per-user OAuth tokens, webhook signing secrets). NOT used by
  # the minimal template's code — kept here so the user-secrets pattern
  # works out of the box. See docs/patterns/user-secrets.md.
  hereya/aws-secret-vault:
    version: 0.1.0

devDeploy:
  hereya/dev-iam-user:
    version: 0.1.1

deploy:
  hereya/aws-app-lambda:
    version: 0.5.2

preDeployCommand: npm install && npm run build
