# hereya/aws-file-storage parameters.
#
# The package's S3 prefix is fixed by the stack name (collision-free
# across hereya projects + workspaces) — there's no `prefix` knob to
# set.
#
# `deleteObjects` (optional): JSON-encoded array of S3 lifecycle
# rules. Each entry creates one rule that expires objects under
# `<assigned-prefix>/<subPrefix>/` after `after` days. Rules
# belonging to other tenants of the same shared bucket are preserved.
#
# It MUST be a JSON-encoded string here, not an inline YAML array —
# hereya passes parameter values through `String(value)` to env vars,
# which would otherwise mangle objects into `"[object Object]"`.
#
# Example: auto-expire ephemeral email attachments after 7 days,
# reports after 30:
#
# deleteObjects: '[{"after": 7, "subPrefix": "attachments"}, {"after": 30, "subPrefix": "reports"}]'
