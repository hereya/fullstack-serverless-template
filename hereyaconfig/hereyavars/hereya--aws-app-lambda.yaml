# Auto-Route53 mode.
#
# `domain` left empty so the stack reads `effectiveDomain` from the
# workspace env (set by hereya/postmark-app-server's output) and uses
# the same random subdomain. The hosted zone is discovered via
# `defaultRootDomain`, which the workspace exposes.
#
# In this mode the stack provisions a DnsValidatedCertificate
# (one-deploy, auto-validated against Route 53) and creates ALIAS
# A/AAAA records for apex + www pointing at the CloudFront
# distribution. No manual DNS records required.
